# SonarQube project settings.
sonar.organization=opensesame
sonar.projectKey=OpenSesame_core-github-actions
sonar.projectName=core-github-actions
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze the reusable workflows, composite actions, and scripts.
sonar.sources=.

# Jest tests sit under .github/workflows/TESTS (with their helpers) and next to the scripts.
sonar.tests=.
sonar.test.inclusions=\
  **/*.test.js,\
  .github/workflows/TESTS/**

# Keep the main and test sets disjoint, and skip dependencies and files managed by the
# repository validator kit.
sonar.exclusions=\
  **/*.test.js,\
  .github/workflows/TESTS/**,\
  **/node_modules/**,\
  .vscode/**,\
  .core-services/*/**,\
  .core-services/README.md,\
  .core-services/repository-contract.schema.json,\
  .core-services/repository-standard.json,\
  .core-services/validator-manifest.json

# CI downloads the coverage-* artifacts into .sonar-coverage/.
sonar.javascript.lcov.reportPaths=.sonar-coverage/**/lcov.info
