name: JS Checks

on:
  workflow_call:
    inputs:
      commit-identifier:
        description: Commit SHA or ref to lint and format-check; defaults to the ref that triggered the workflow
        type: string
        required: false
        default: ''
    secrets:
      ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN:
        description: Read-only token for the org's GitHub Packages npm registry, needed when the repository depends on private @opensesame packages
        required: false
    outputs:
      lint:
        description: Outcome of the lint step (success, failure, cancelled or skipped)
        value: ${{ jobs.checks.outputs.lint }}
      format:
        description: Outcome of the format-check step (success, failure, cancelled or skipped)
        value: ${{ jobs.checks.outputs.format }}
      baselined:
        description: Number of inline ESLint disable and Prettier ignore comments in JS and TS files
        value: ${{ jobs.checks.outputs.baselined }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the code to lint.
    outputs:
      lint: ${{ steps.lint.outcome }}
      format: ${{ steps.format.outcome }}
      baselined: ${{ steps.baseline.outputs.count }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@opensesame'

      - name: Install dependencies
        id: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:js

      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:prettier

      - name: Count baselined issues
        id: baseline
        if: ${{ !cancelled() }}
        run: |
          inline=$({ git grep -ohE '(^|[[:space:]{])(//|/\*)[[:space:]]*(eslint-disable|prettier-ignore)' -- '*.js' '*.mjs' '*.cjs' '*.jsx' '*.ts' '*.mts' '*.cts' '*.tsx' ':!.core-services' || true; } | awk 'END { print NR }')
          echo "Inline ESLint and Prettier ignores: $inline"
          echo "count=$inline" >> "$GITHUB_OUTPUT"
