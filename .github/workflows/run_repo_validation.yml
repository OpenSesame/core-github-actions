name: Repo Validation

on:
  workflow_call:
    inputs:
      commit-identifier:
        description: Commit SHA or ref to validate; defaults to the ref that triggered the workflow
        type: string
        required: false
        default: ''
    secrets:
      ORG_READ_ONLY_SSH_KEY:
        description: Read-only SSH key for OpenSesame/core-services-ai-tooling, used to look up the latest validator release
        required: false
    outputs:
      result:
        description: Outcome of the validation step (success, failure, cancelled or skipped)
        value: ${{ jobs.validate.outputs.result }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the repository to validate.
    env:
      HAS_ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY != '' }}
    outputs:
      result: ${{ steps.validate.outcome }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Configure GitHub SSH credentials
        id: ssh
        if: ${{ env.HAS_ORG_READ_ONLY_SSH_KEY == 'true' }}
        continue-on-error: true
        uses: OpenSesame/core-github-actions/.github/actions/configure-github-ssh@6d23fbcf9eb4c24c5f3404ef8bd175371f7e69a9 # actions/configure-github-ssh/1.0.0
        with:
          ssh-private-key: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}

      - name: Look up the latest validator release
        id: latest
        env:
          SSH_SETUP: ${{ steps.ssh.outcome }}
        run: |
          if [[ "$SSH_SETUP" == skipped ]]; then
            echo "::notice title=Repo Validation::No ORG_READ_ONLY_SSH_KEY secret, so the validator can't check for a newer release."
            exit 0
          fi
          if [[ "$SSH_SETUP" != success ]]; then
            echo "::warning title=Repo Validation::Could not configure SSH to look up the latest validator release."
            exit 0
          fi
          if tags=$(GIT_SSH_COMMAND="ssh -o BatchMode=yes" timeout 30s git ls-remote --tags --refs \
            git@github.com:OpenSesame/core-services-ai-tooling.git 'refs/tags/repository-validator/*'); then
            version=$(sed -n 's#.*refs/tags/repository-validator/##p' <<< "$tags" \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Repo Validation::Could not look up the latest validator release."
          fi

      - name: Remove GitHub SSH credentials
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        run: rm -rf "$RUNNER_TEMP/configure-github-ssh" ~/.ssh/config

      - name: Validate repository
        id: validate
        env:
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          VALIDATOR: .core-services/generated/validate-repo.mjs
        run: |
          if [[ ! -f "$VALIDATOR" ]]; then
            echo "::error title=Repo Validation::$VALIDATOR is missing. Install the repository validator kit from OpenSesame/core-services-ai-tooling."
            exit 1
          fi
          node "$VALIDATOR" ${LATEST_VERSION:+--latest-version "$LATEST_VERSION"}
