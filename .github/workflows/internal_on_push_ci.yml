name: Internal CI

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write # needed if reporter is github-pr-check or github-check

jobs:
  internal-ci:
    name: Internal CI
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up npm
        run: npm install --global npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Dependency Audit
        run: npm run audit

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

  semgrep:
    uses: ./.github/workflows/run_semgrep_scan.yml
    secrets: inherit
    with:
      commit_identifier: ${{ github.sha }}
      cancel_in_progress: true
      semgrep_config: 'p/ci p/security-audit p/javascript'
      semgrep_targets: './*.js ./*.mjs ./*.json scripts/ .github/actions/' ## only scanning recently changed files, eventually should cover whole .github/actions/ folder
      fail_severity: 'error'
      semgrep_scan_mode: 'diff'
      reviewdog_filter_mode: 'added'
      reviewdog_reporter: 'github-pr-review'
