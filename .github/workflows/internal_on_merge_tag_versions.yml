name: Set Version Tags

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  no-merge:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: No Merge Detected
        run: |
          message="Pull request was closed without merge. No version tags will be created."
          echo "ℹ️ $message" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=No Merge::$message"

  set-version-tags:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Required to push the version tags.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: true # Required for git push of the version tags.

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Get all labels from PR
        id: get_labels
        run: |
          echo "## PR Labels" >> "$GITHUB_STEP_SUMMARY"

          ## Newline separated list of all labels on the PR
          all_labels=$(jq -r '.pull_request.labels[].name' < "$GITHUB_EVENT_PATH" 2>/dev/null || true)

          if [ -z "$all_labels" ]; then
            echo "- (none)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=No Labels::No Labels were found on this PR. A version label is required."
            exit 1
          else
            while IFS= read -r lbl; do
            [ -z "$lbl" ] && continue
            echo "- \`$lbl\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$all_labels"
          fi

          echo "$all_labels" > all_labels.txt

      - name: Get Version Tags
        id: get_tags
        run: |
          node scripts/internal-ci/get-version-tags/index.js all_labels.txt

      - name: Untracked Version Check
        if: ${{ steps.get_tags.outputs.hasUntracked == 'true' }}
        run: |
          message="Untracked version label detected. Skipping tag creation."
          echo "ℹ️ $message" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Untracked Version::$message"

      - name: Create Version Tags
        if: ${{ steps.get_tags.outputs.hasUntracked != 'true' }}
        env:
          COMPONENT_TAGS: ${{ steps.get_tags.outputs.componentTags }}
        run: |
          IFS=',' read -r -a tagsArray <<< "$COMPONENT_TAGS"
          if [ "${#tagsArray[@]}" -eq 0 ]; then
            exit 0
          fi

          released_tags=$(git ls-remote --tags --refs origin | cut -f2)
          existing=()
          refs=()
          for tag in "${tagsArray[@]}"; do
            if grep -Fxq "refs/tags/$tag" <<< "$released_tags"; then
              existing+=("$tag")
            fi
            refs+=("refs/tags/$tag")
          done

          if [ "${#existing[@]}" -gt 0 ]; then
            message="These tags already exist, so no tags were created: ${existing[*]}"
            echo "❌ $message" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Tags Already Exist::$message"
            exit 1
          fi

          for tag in "${tagsArray[@]}"; do
            git tag "$tag"
          done
          if ! git push --atomic origin "${refs[@]}"; then
            message="The atomic push was rejected, so no tags were pushed. Another run may have created one of these tags since the check: ${tagsArray[*]}"
            echo "❌ $message" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Tag Push Rejected::$message"
            exit 1
          fi

          for tag in "${tagsArray[@]}"; do
            echo "✅ Created and pushed tag: $tag" >> "$GITHUB_STEP_SUMMARY"
          done
