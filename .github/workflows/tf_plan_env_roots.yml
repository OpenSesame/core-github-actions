name: TF Plan ENV Roots

on:
  workflow_call:
    inputs:
      commit-identifier:
        description: SHA or tag for terraform plan
        type: string
        required: true
      oidc-domain:
        description: 'OIDC Domain. Ex: "core" or "reveng"'
        required: true
        type: string
      terraform-workspace:
        description: Terraform Workspace, (optional) when omitted, the environment is used
        type: string
        required: false
      terraform-version:
        description: Terraform version to use
        type: string
        required: true
      build-artifact-directory:
        description: Optional directories to create before running terraform plan. Path should be relative to the terraform-root supplied. Example - "../../lambdas/auth-api/dist/out-tsc" Use multi-line string if multiple directories are needed.
        type: string
        required: false
      detect-build-artifact-directories:
        description: Before running terraform plan, create missing git-ignored directories that each root and its local modules reference through path.module, path.root or path.cwd, (default - true)
        type: boolean
        default: true
    secrets:
      ORG_READ_ONLY_SSH_KEY:
        required: true
      ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN:
        required: true

permissions: {}

jobs:
  environment:
    name: ${{ matrix.environment }}
    uses: ./.github/workflows/tf_plan_single_root.yml
    permissions:
      id-token: write # Required by tf_plan_single_root to assume the plan role.
      contents: read # Required by tf_plan_single_root to check out the Terraform code.
    strategy:
      fail-fast: false # continues to run jobs even if one fails
      matrix:
        environment: [dev, stage, prod]
    with:
      environment: ${{ matrix.environment }}
      commit-identifier: ${{ inputs.commit-identifier }}
      oidc-domain: ${{ inputs.oidc-domain }}
      with-lock: false
      terraform-workspace: ${{ inputs.terraform-workspace || matrix.environment }}
      terraform-root: terraform/${{ matrix.environment }}
      terraform-version: ${{ inputs.terraform-version }}
      build-artifact-directory: ${{ inputs.build-artifact-directory }}
      detect-build-artifact-directories: ${{ inputs.detect-build-artifact-directories }}
    secrets:
      ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}
      ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN: ${{ secrets.ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN }}
