name: Semgrep Scan

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      commit-identifier:
        description: Commit SHA or ref to scan; defaults to the ref that triggered the workflow
        type: string
        required: false
        default: ''
      semgrep-config:
        description: Semgrep rulesets to use. Accepts a YAML array, newline or space-separated list
        type: string
        required: false
        default: p/default
      semgrep-targets:
        description: Files or directories to scan. Accepts a YAML array, newline or space-separated list
        type: string
        required: false
        default: .
      extra-args:
        description: Additional arguments to pass to Semgrep (e.g., --exclude, --timeout)
        type: string
        required: false
        default: ''
      semgrep-version:
        description: Semgrep version to install
        type: string
        required: false
        default: '1.178.0'
      fail-severity:
        description: Lowest finding severity that fails the job (error | warning | info)
        type: string
        required: false
        default: error
      semgrep-scan-mode:
        description: What Semgrep scans (full | diff)
        type: string
        required: false
        default: full
      baseline-ref:
        description: Baseline ref for diff scans outside pull_request events; defaults to origin/<default branch>
        type: string
        required: false
        default: ''
      reviewdog-filter-mode:
        description: Which findings reviewdog posts on pull_request events (added | diff_context | nofilter); does not change what Semgrep scans
        type: string
        required: false
        default: added
      reviewdog-reporter:
        description: Reviewdog reporter on pull_request events (github-pr-review | github-pr-check); other events use github-check
        type: string
        required: false
        default: github-pr-review
    outputs:
      total-findings:
        description: Total number of findings
        value: ${{ jobs.scan.outputs.total-findings }}
      error-count:
        description: Number of ERROR findings
        value: ${{ jobs.scan.outputs.error-count }}
      warning-count:
        description: Number of WARNING findings
        value: ${{ jobs.scan.outputs.warning-count }}
      info-count:
        description: Number of INFO findings
        value: ${{ jobs.scan.outputs.info-count }}

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the code to scan.
      pull-requests: write # Required to post review comments and the summary comment on pull requests.
      checks: write # Required for the github-check and github-pr-check reviewdog reporters.

    outputs:
      total-findings: ${{ steps.semgrep.outputs.total-findings }}
      error-count: ${{ steps.semgrep.outputs.error-count }}
      warning-count: ${{ steps.semgrep.outputs.warning-count }}
      info-count: ${{ steps.semgrep.outputs.info-count }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          fetch-depth: ${{ inputs.semgrep-scan-mode == 'full' && '1' || '0' }}
          persist-credentials: false

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: |
          if [ -n "$SEMGREP_VERSION" ]; then
            python3 -m pip install "semgrep==$SEMGREP_VERSION"
          else
            python3 -m pip install semgrep
          fi

      - name: Run Semgrep
        id: semgrep
        uses: OpenSesame/core-github-actions/.github/actions/run-semgrep@6f65168d25177f593463432bd03587c0733c7913 # actions/run-semgrep/2.0.0
        env:
          INPUT_BASELINE: ${{ inputs.baseline-ref || format('origin/{0}', github.event.repository.default_branch) }}
          SCAN_MODE: ${{ inputs.semgrep-scan-mode }}
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
          SEMGREP_TARGETS: ${{ inputs.semgrep-targets }}
          FAIL_LEVEL: ${{ inputs.fail-severity }}
          EXTRA_ARGS: ${{ inputs.extra-args }}

      - name: Upload results artifact
        if: ${{ steps.semgrep.outputs.total-findings > 0 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-${{ github.run_id }}.json
          path: semgrep_results.json
          if-no-files-found: error
          retention-days: 7

      - name: Set up reviewdog
        if: ${{ steps.semgrep.outputs.total-findings > 0 }}
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Select reviewdog settings
        id: reviewdog-settings
        if: ${{ steps.semgrep.outputs.total-findings > 0 }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPORTER: ${{ inputs.reviewdog-reporter }}
          FILTER_MODE: ${{ inputs.reviewdog-filter-mode }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            REPORTER="github-check"
            FILTER_MODE="nofilter"
            echo "Not a pull_request event; using the github-check reporter with nofilter"
          fi

          echo "reporter=$REPORTER" >> "$GITHUB_OUTPUT"
          echo "filter-mode=$FILTER_MODE" >> "$GITHUB_OUTPUT"

      - name: Report findings with reviewdog
        if: ${{ steps.semgrep.outputs.total-findings > 0 }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          REVIEWDOG_REPORTER: ${{ steps.reviewdog-settings.outputs.reporter }}
          REVIEWDOG_FILTER_MODE: ${{ steps.reviewdog-settings.outputs.filter-mode }}
          REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-severity }}
        run: |
          reviewdog \
            -efm="%t:%f:%l %m" \
            -name="semgrep" \
            -reporter="$REVIEWDOG_REPORTER" \
            -filter-mode="$REVIEWDOG_FILTER_MODE" \
            -fail-level="$REVIEWDOG_FAIL_LEVEL" < reviewdog_input.txt

      - name: Write job summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCAN_SUMMARY: ${{ steps.semgrep.outputs.scan-summary }}
          CONFIG_SUMMARY: ${{ steps.semgrep.outputs.config-summary }}
          FILTER_MODE: ${{ steps.reviewdog-settings.outputs.filter-mode }}
          REVIEWDOG_REPORTER: ${{ steps.reviewdog-settings.outputs.reporter }}
        run: |
          {
            echo "## 🔎 Semgrep Summary"
            echo "triggered by: \`${EVENT_NAME}\` on \`${REF}\`"
            echo -e "${SCAN_SUMMARY}"
            echo -e "${CONFIG_SUMMARY}"
            if [[ -n "$REVIEWDOG_REPORTER" ]]; then
              echo "- **Review filter**: \`${FILTER_MODE}\`"
              echo "- **Reviewdog reporter**: \`${REVIEWDOG_REPORTER}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate PR comment body
        if: ${{ github.event_name == 'pull_request' }}
        id: generate-body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_STATUS: ${{ steps.semgrep.outputs.scan-status }}
          TOTAL_FINDINGS: ${{ steps.semgrep.outputs.total-findings }}
          NUM_ERRORS: ${{ steps.semgrep.outputs.error-count }}
          NUM_WARNINGS: ${{ steps.semgrep.outputs.warning-count }}
          NUM_INFO: ${{ steps.semgrep.outputs.info-count }}
        with:
          result-encoding: string
          script: |
            const scanStatus = process.env.SCAN_STATUS;
            const total   = Number(process.env.TOTAL_FINDINGS || '0');
            const errors  = Number(process.env.NUM_ERRORS || '0');
            const warns   = Number(process.env.NUM_WARNINGS || '0');
            const info    = Number(process.env.NUM_INFO || '0');

            const emoji = scanStatus === 'success' ? "✅" : "❌";
            const statusText =  scanStatus === 'success' ? "passed" : "failed";

            const heading = `## ${emoji} Semgrep Security Scan ${statusText.charAt(0).toUpperCase() + statusText.slice(1)}`

            const parts = [];
            if (errors > 0) parts.push(`${errors} error${errors === 1 ? "" : "s"}`);
            if (warns  > 0) parts.push(`${warns} warning${warns === 1 ? "" : "s"}`);
            if (info   > 0) parts.push(`${info} info`);

            const findings = total > 0 ? `\n\n${parts.join(", ")}` : "\n\n🎉 No security issues found!";

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const body = `${heading}
            ${findings}

            [View run](${runUrl})
            <sub>🤖 Powered by Semgrep + reviewdog</sub>`;

            core.setOutput('body', body);

      - name: Upsert PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: OpenSesame/core-github-actions/.github/actions/upsert-pr-comment@3facf8375da0266732c48933ef95c3dd333817fc # actions/upsert-pr-comment/1.0.1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          comment-marker: semgrep-summary
          body-content: ${{ steps.generate-body.outputs.body }}

      - name: Fail on findings at or above threshold
        if: ${{ steps.semgrep.outputs.scan-status == 'failure' }}
        env:
          FAIL_SEVERITY: ${{ inputs.fail-severity }}
        run: |
          echo "❌ Semgrep exceeded fail-severity='${FAIL_SEVERITY}'"
          exit 1
