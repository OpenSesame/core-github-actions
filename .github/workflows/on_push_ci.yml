name: Internal CI
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} CI', github.event.pull_request.number) || github.event_name == 'push' && format('Push {0} CI', github.ref_name) || format('Manual {0} CI', inputs.commit-identifier || github.ref_name) }}"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commit-identifier:
        description: Commit SHA or ref to test and scan; when omitted, the selected branch head is used
        type: string
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci-context:
    name: CI Context
    uses: ./.github/workflows/resolve_ci_context.yml
    permissions:
      contents: read # Required to read commit metadata for the open-PR lookup.
      pull-requests: read # Required to find an open PR from the pushed branch.
    with:
      commit-identifier: ${{ inputs.commit-identifier }}

  app-ci:
    name: App CI
    needs: ci-context
    if: ${{ needs.ci-context.outputs.should-run-ci == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the code under test.

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-context.outputs.commit-identifier }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      # The audit runs here, not through run_npm_audit: this repository has only devDependencies,
      # and run_npm_audit audits production dependencies only (--omit=dev), so it would check nothing.
      - name: Audit dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:npm

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Upload coverage
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-core-github-actions
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  repo-checks:
    name: Repo Checks
    needs: ci-context
    if: ${{ needs.ci-context.outputs.should-run-ci == 'true' }}
    uses: ./.github/workflows/run_repo_checks.yml
    permissions:
      contents: read # Required to check out the code to lint, format-check, scan and validate.
    with:
      commit-identifier: ${{ needs.ci-context.outputs.commit-identifier }}
    secrets:
      ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}

  semgrep:
    name: Semgrep
    needs: ci-context
    if: ${{ needs.ci-context.outputs.should-run-ci == 'true' }}
    uses: ./.github/workflows/run_semgrep_scan.yml
    permissions:
      contents: read # Required to check out the code to scan.
      pull-requests: write # Required to post review comments and the summary comment on pull requests.
      checks: write # Required for reviewdog check annotations outside pull requests.
    with:
      commit-identifier: ${{ needs.ci-context.outputs.commit-identifier }}
      semgrep-config: 'p/ci p/security-audit p/javascript'
      semgrep-targets: './*.js ./*.mjs ./*.json scripts/ .github/actions/'
      semgrep-scan-mode: ${{ github.ref_name == github.event.repository.default_branch && 'full' || 'diff' }}

  sonar:
    name: Sonar
    needs: [ci-context, app-ci]
    if: ${{ !cancelled() && needs.ci-context.outputs.should-run-ci == 'true' }}
    uses: ./.github/workflows/run_sonar_scan.yml
    permissions:
      contents: read # Required to check out the code to scan.
    with:
      commit-identifier: ${{ needs.ci-context.outputs.commit-identifier }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-result:
    name: CI Result
    needs: [ci-context, app-ci, repo-checks, semgrep, sonar]
    if: ${{ !cancelled() && needs.ci-context.outputs.should-run-ci != 'false' }}
    runs-on: ubuntu-26.04
    permissions: {}

    steps:
      - name: Check CI job results
        uses: OpenSesame/core-github-actions/.github/actions/check-ci-result@95f95aac6fe51a55e656e82ba17ba213c530d13a # actions/check-ci-result/1.0.0
        with:
          needs-json: ${{ toJSON(needs) }}
