name: TF Apply

on:
  workflow_call:
    inputs:
      environment:
        description: Github action environment and AWS account type
        type: string
        required: true
      oidc-domain:
        description: 'OIDC Domain. Ex: "core" or "reveng"'
        required: true
        type: string
      commit-identifier:
        description: SHA or tag to apply
        type: string
        required: true
      release-tag:
        description: release name to apply to resources
        type: string
        required: false
        default: unnamed
      terraform-workspace:
        description: Terraform Workspace
        type: string
        required: true
      terraform-root:
        description: Root directory of terraform
        type: string
        required: true
      terraform-version:
        description: Terraform version to use
        type: string
        required: true
    secrets:
      ORG_READ_ONLY_SSH_KEY:
        required: true
      ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN:
        required: true

concurrency:
  group: ${{ github.repository }}-${{ inputs.environment }}-TF-Apply

permissions:
  id-token: write
  contents: read

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  Summary:
    runs-on: ubuntu-26.04
    steps:
      - name: Markdown Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          INPUTS_JSON: ${{ toJson(inputs) }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          {
            echo "### Apply Infrastructure Context"
            echo "**Trigger**: $EVENT_NAME $EVENT_ACTION"
            echo "**Actor**: $ACTOR"
            echo "**Workflow Ref (branch)**: $WORKFLOW_REF"
            echo -e "**Workflow Sha (commit)**: $WORKFLOW_SHA\n"
            echo "**Inputs**"
            echo -e "$INPUTS_JSON\n"
            echo "**Release Tag**: $RELEASE_TAG"
            echo "*Note: Workflow Ref & Sha represent the branch and commit of the workflow defintion. This may not be the same as the branch/commit checked out supplying the code. The 'SHA or tag to apply' aka commit-identifier, is what specifies the code.*"
          } >> "$GITHUB_STEP_SUMMARY"

  TF-Apply:
    name: Terraform Apply
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment}}
    defaults:
      run:
        working-directory: ${{ inputs.terraform-root }}
    env:
      TF_VAR_IACDeploymentRef: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TF_VAR_release_name: ${{ inputs.release-tag }}

    steps:
      - id: get-role-arn
        uses: OpenSesame/gha-oidc-access/get-role-arn@42e851ba54935047834bc50a3e2de800cc4952b9 # v2.0.2
        with:
          domain: ${{ inputs.oidc-domain }}
          env: ${{ inputs.environment }}
          ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.get-role-arn.outputs.role-arn }}
          role-session-name: ${{ inputs.terraform-workspace }}-${{ inputs.environment }}-Run${{ github.run_id }}
          aws-region: ${{ steps.get-role-arn.outputs.region }}

      - name: Checkout Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          persist-credentials: false

      - name: Configure Github Credentials
        id: configure-credentials
        shell: bash
        env:
          ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORG_READ_ONLY_SSH_KEY" > ~/.ssh/id_rsa
          ssh-keyscan github.com > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false # required to access terraform outputs after apply

      - name: Init Terraform
        run: terraform init -upgrade

      - name: Select Workspace
        env:
          TF_WORKSPACE_NAME: ${{ inputs.terraform-workspace }}
        run: terraform workspace select -or-create "$TF_WORKSPACE_NAME"

      - name: Apply Terraform
        run: terraform apply -auto-approve -input=false
