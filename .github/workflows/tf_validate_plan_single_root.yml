name: TF Validate/Plan Single Root

on:
  workflow_call:
    inputs:
      environment:
        description: Github action environment and AWS account type
        type: string
        required: true
      oidc-domain:
        description: 'OIDC Domain. Ex: "core" or "reveng"'
        required: true
        type: string
      commit-identifier:
        description: SHA or tag to validate and plan terraform
        type: string
        required: true
      with-lock:
        description: whether to lock the state file or not, (default - true)
        type: boolean
        default: true
      write-artifact:
        description: write the terraform plan to an artifact, (default - false)
        type: boolean
        default: false
      terraform-workspace:
        description: Terraform Workspace
        type: string
        required: true
      terraform-root:
        description: Root directory of terraform
        type: string
        required: true
      terraform-version:
        description: Terraform version to use
        type: string
        required: true
      build-artifact-directory:
        description: Optional directories to create before running terraform plan. Path should be relative to the terraform-root supplied. Example - "../../lambdas/auth-api/dist/out-tsc" Use multi-line string if multiple directories are needed.
        type: string
        required: false
    secrets:
      ORG_READ_ONLY_SSH_KEY:
        required: true
      ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN:
        required: true
    outputs:
      plan-artifact-name:
        description: the name of the plan artifact, if write-artifact is true
        value: ${{ jobs.validate-plan.outputs.plan-artifact-name }}

concurrency:
  group: ${{ inputs.with-lock && format('{0}-{1}-TF-Validate-Plan', github.repository, inputs.environment) || format('{0}-{1}-TF-Validate-Plan-{2}-{3}', github.repository, inputs.environment, github.run_id, inputs.terraform-root) }}

permissions: {}

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  validate-plan:
    name: Validate Plan
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required by configure-aws-credentials to assume the plan role.
      contents: read # Required to check out the Terraform code.
    defaults: # runs all steps in this directory
      run:
        working-directory: ${{ inputs.terraform-root }}
    outputs:
      plan-artifact-name: ${{ steps.set-plan-artifact-name.outputs.artifact-name }}

    steps:
      - name: Get role ARN
        id: get-role-arn
        uses: OpenSesame/gha-oidc-access/get-role-arn@42e851ba54935047834bc50a3e2de800cc4952b9 # v2.0.2
        with:
          domain: ${{ inputs.oidc-domain }}
          env: ${{ inputs.environment }}
          ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.get-role-arn.outputs.role-arn }}
          role-session-name: ${{ inputs.terraform-workspace }}-${{ inputs.environment }}-Run${{ github.run_id }}
          aws-region: ${{ steps.get-role-arn.outputs.region }}

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          persist-credentials: false

      - name: Configure GitHub SSH credentials
        id: configure-credentials
        shell: bash
        env:
          ORG_READ_ONLY_SSH_KEY: ${{ secrets.ORG_READ_ONLY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORG_READ_ONLY_SSH_KEY" > ~/.ssh/id_rsa
          ssh-keyscan github.com > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false # required to access terraform outputs after apply

      - name: Create build artifact directories
        if: ${{ inputs.build-artifact-directory != '' }}
        env:
          BUILD_ARTIFACT_DIRECTORY: ${{ inputs.build-artifact-directory }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          printf 'Directories input:\n---\n%s\n---\n' "$BUILD_ARTIFACT_DIRECTORY"
          while IFS= read -r dir; do
            dir="$(printf '%s' "$dir" | tr -d '\r' | xargs)"  # strip CR, trim
            [ -z "$dir" ] && continue
            echo "Creating: [$dir]"
            mkdir -p -- "$dir"
          done <<< "$BUILD_ARTIFACT_DIRECTORY"

      - name: Initialize Terraform
        run: terraform init -upgrade

      - name: Validate Terraform
        run: terraform validate

      - name: Select workspace
        env:
          TF_WORKSPACE_NAME: ${{ inputs.terraform-workspace }}
        run: terraform workspace select -or-create "$TF_WORKSPACE_NAME"

      - name: Reinitialize Terraform
        run: terraform init -upgrade

      - name: Plan Terraform
        id: plan
        env:
          WITH_LOCK: ${{ inputs.with-lock }}
        run: terraform plan -lock="$WITH_LOCK" -out=tfplan

      - name: Write plan summary
        id: write-plans
        env:
          TF_ENVIRONMENT: ${{ inputs.environment }}
          TF_ROOT: ${{ inputs.terraform-root }}
          TF_VERSION: ${{ inputs.terraform-version }}
        run: |
          if [ -f tfplan ]; then
            WORKSPACE_NAME=$(basename "$(pwd)")

            terraform show tfplan -no-color > tfplan.txt

            {
              echo "## 🚀 Terraform Plan Summary"
              echo ""
              echo "**Workspace:** \`$WORKSPACE_NAME\`"
              echo "**AWS Environment:** \`$TF_ENVIRONMENT\`"
              echo "**Terraform Root:** \`$TF_ROOT\`"
              echo "**Terraform Version:** \`$TF_VERSION\`"
              echo ""
              echo "<details>"
              echo "<summary><strong>📋 Click to view detailed Terraform plan</strong></summary>"
              echo ""
              echo "~~~ terraform"
              cat tfplan.txt
              echo "~~~"
              echo ""
              echo "</details>"
              echo ""
              echo "---"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ Warning"
              echo ""
              echo "No Terraform plan file found in \`$(pwd)\`"
              echo ""
              echo "This may indicate an issue with the Terraform plan generation."
              echo ""
              echo "---"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set plan artifact name
        id: set-plan-artifact-name
        if: ${{ inputs.write-artifact }}
        env:
          TF_ENVIRONMENT: ${{ inputs.environment }}
        run: echo "artifact-name=terraform-plan-${TF_ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        id: plan-artifact
        if: ${{ inputs.write-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.set-plan-artifact-name.outputs.artifact-name }}
          path: ${{ inputs.terraform-root }}/tfplan.txt
