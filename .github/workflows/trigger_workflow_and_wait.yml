name: Trigger workflow and wait

on:
  workflow_call:
    inputs:
      owner:
        description: The owner of the repository where the workflow is contained.
        type: string
        required: true
      repo:
        description: The repository where the workflow is contained.
        type: string
        required: true
      workflow-file:
        description: Name of the target workflow to run (e.g., run_e2e.yml).
        type: string
        required: true
      commit-identifier:
        description: Git ref in the target repo (branch or tag).
        type: string
        default: main
      wait-interval:
        description: Seconds to wait between polling attempts for the downstream run status.
        type: number
        default: 20
      client-payload:
        description: JSON object string to pass as workflow_dispatch inputs (e.g. {"environment":"dev","identity_domain":"identity-dev"})
        type: string
        required: true
    outputs:
      downstream-run-id:
        description: ID of the downstream workflow run created by the dispatch
        value: ${{ jobs.trigger.outputs.downstream-run-id }}
      downstream-html-url:
        description: GitHub URL of the downstream workflow run
        value: ${{ jobs.trigger.outputs.downstream-html-url }}
      conclusion:
        description: Final conclusion of the downstream workflow run
        value: ${{ jobs.trigger.outputs.conclusion }}
    secrets:
      ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN:
        required: true

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-26.04
    outputs:
      downstream-run-id: ${{ steps.run.outputs.downstream-run-id }}
      downstream-html-url: ${{ steps.run.outputs.downstream-html-url }}
      conclusion: ${{ steps.run.outputs.conclusion }}
    steps:
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Dispatch and wait
        id: run
        env:
          API_URL: https://api.github.com
          OWNER: ${{ inputs.owner }}
          REPO: ${{ inputs.repo }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          REF: ${{ inputs.commit-identifier }}
          TOKEN: ${{ secrets.ORG_GITHUB_PACKAGES_READ_ONLY_TOKEN }}
          WAIT_INTERVAL: ${{ inputs.wait-interval }}
          CLIENT_PAYLOAD: ${{ inputs.client-payload }}
        run: |
          set -euo pipefail

          api() {
            local path=$1; shift
            curl --fail-with-body -sSL "${API_URL}/repos/${OWNER}/${REPO}/actions/${path}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' "$@"
          }

          if ! printf '%s' "$CLIENT_PAYLOAD" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error title=Trigger workflow and wait::client-payload must be a JSON object"
            exit 1
          fi

          body="$(jq -nc --arg ref "$REF" --argjson inputs "$CLIENT_PAYLOAD" \
            '{ref: $ref, inputs: $inputs, return_run_details: true}')"

          echo "Dispatching ${WORKFLOW_FILE} on ${OWNER}/${REPO}@${REF} with inputs [redacted]"
          response="$(api "workflows/${WORKFLOW_FILE}/dispatches" --data "$body")"

          downstream_run_id="$(printf '%s' "$response" | jq -r '.workflow_run_id // empty' 2>/dev/null || true)"
          downstream_html_url="$(printf '%s' "$response" | jq -r '.html_url // empty' 2>/dev/null || true)"

          if ! [[ "$downstream_run_id" =~ ^[0-9]+$ ]] || [ -z "$downstream_html_url" ]; then
            echo "::error title=Trigger workflow and wait::The dispatch response for ${OWNER}/${REPO}/${WORKFLOW_FILE} did not include workflow_run_id and html_url, so the downstream run cannot be identified"
            exit 1
          fi

          echo "downstream-run-id=${downstream_run_id}"     >> "$GITHUB_OUTPUT"
          echo "downstream-html-url=${downstream_html_url}" >> "$GITHUB_OUTPUT"
          echo "Started: ${downstream_html_url}"

          status=""
          conclusion="null"
          while [ "$status" != "completed" ] && [ "$conclusion" = "null" ]; do
            sleep "${WAIT_INTERVAL}"
            run_json="$(api "runs/${downstream_run_id}")"
            status="$(echo "$run_json" | jq -r '.status')"
            conclusion="$(echo "$run_json" | jq -r '.conclusion')"
            echo "status=${status} conclusion=${conclusion}"
          done

          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

          if [ "$conclusion" != "success" ]; then
            exit 1
          fi
