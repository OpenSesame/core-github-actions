name: Shell Checks

on:
  workflow_call:
    inputs:
      commit-identifier:
        description: Commit SHA or ref to lint and format-check; defaults to the ref that triggered the workflow
        type: string
        required: false
        default: ''
    outputs:
      lint:
        description: Outcome of the lint step (success, failure, cancelled or skipped)
        value: ${{ jobs.checks.outputs.lint }}
      format:
        description: Outcome of the format-check step (success, failure, cancelled or skipped)
        value: ${{ jobs.checks.outputs.format }}
      baselined:
        description: Number of inline shellcheck disable directives outside Markdown files
        value: ${{ jobs.checks.outputs.baselined }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the shell scripts to lint.
    outputs:
      lint: ${{ steps.lint.outcome }}
      format: ${{ steps.format.outcome }}
      baselined: ${{ steps.baseline.outputs.count }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          persist-credentials: false

      - name: Set up mise
        id: mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.mise.outcome == 'success' }}
        run: mise run lint:shell

      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.mise.outcome == 'success' }}
        run: mise run format:shell

      - name: Count baselined issues
        id: baseline
        if: ${{ !cancelled() }}
        run: |
          inline=$({ git grep -ohE '(^|[[:space:]])#[[:space:]]*shellcheck[[:space:]]+disable=' -- ':!.core-services' ':!*.md' || true; } | awk 'END { print NR }')
          echo "Inline shellcheck disables: $inline"
          echo "count=$inline" >> "$GITHUB_OUTPUT"
