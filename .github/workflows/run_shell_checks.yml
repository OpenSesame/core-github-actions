name: Shell Checks

on:
  workflow_call:
    inputs:
      commit-identifier:
        description: Commit SHA or ref to lint and format-check; defaults to the ref that triggered the workflow
        type: string
        required: false
        default: ''
    outputs:
      lint:
        description: Outcome of the lint step (success, failure, cancelled or skipped)
        value: ${{ jobs.checks.outputs.lint }}
      format:
        description: Outcome of the format-check step (success, failure, cancelled or skipped)
        value: ${{ jobs.checks.outputs.format }}
      baselined:
        description: Number of inline shellcheck disable directives
        value: ${{ jobs.checks.outputs.baselined }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the shell scripts to lint.
    outputs:
      lint: ${{ steps.lint.outcome }}
      format: ${{ steps.format.outcome }}
      baselined: ${{ steps.baseline.outputs.count }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-identifier }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.17
          sha256: 63049bc35fb9065e8dc35ac8b25fdae53e9bd6f1885a843aedeba398e046a1ee

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Check npm scripts
        if: ${{ !cancelled() }}
        env:
          TECHNOLOGY: Shell
          SCRIPTS: lint:shell format:shell
        run: |
          missing=0
          for script in $SCRIPTS; do
            if ! jq -e --arg script "$script" '.scripts[$script] | type == "string"' package.json > /dev/null 2>&1; then
              echo "::error title=Missing npm script::$TECHNOLOGY files are present, but package.json has no $script script."
              missing=1
            fi
          done
          exit "$missing"

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:shell

      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:shell

      - name: Count baselined issues
        id: baseline
        if: ${{ !cancelled() }}
        run: |
          inline=$({ git grep -c 'shellcheck disable[=]' -- ':!.core-services' || true; } | awk -F: '{ sum += $NF } END { print sum + 0 }')
          echo "Inline shellcheck disables: $inline"
          echo "count=$inline" >> "$GITHUB_OUTPUT"
