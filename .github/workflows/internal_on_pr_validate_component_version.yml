name: Validate PR Version Labels

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - edited
      - labeled # important to catch version label additions
      - unlabeled
      - reopened

concurrency:
  group: validate-version-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate-version-labels:
    name: Validate PR Version Labels
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to check out the changelogs and validation scripts.
      pull-requests: write # Required to upsert the version summary comment.

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get all labels from PR
        id: get_labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          echo "## PR Labels" >> "$GITHUB_STEP_SUMMARY"

          ## Newline separated list of all labels on the PR, read from the API rather than the event
          ## payload. Failed requests are retried. Apps such as Renovate add labels just after
          ## opening a PR, so an opened or reopened PR without a v: label is polled for up to
          ## 30 seconds, and the last label set read is validated.
          attempts=3
          wait_for_version_label=false
          if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ]; then
            attempts=7
            wait_for_version_label=true
          fi
          fetched=false
          all_labels=""
          for attempt in $(seq 1 "$attempts"); do
            if response=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name'); then
              fetched=true
              all_labels=$response
              if [ "$wait_for_version_label" = "false" ] || grep -q '^v:' <<< "$all_labels"; then
                break
              fi
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 5
            fi
          done

          if [ "$fetched" = "false" ]; then
            echo "labels_unavailable=true" >> "$GITHUB_OUTPUT"
            echo "- (unavailable)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Labels Unavailable::Could not read this PR's labels from the GitHub API after $attempts attempts."
            exit 1
          fi

          if [ -z "$all_labels" ]; then
            echo "no_labels=true" >> "$GITHUB_OUTPUT"
            echo "- (none)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=No Labels::No Labels were found on this PR. A version label is required."
            exit 1
          else
            while IFS= read -r lbl; do
            [ -z "$lbl" ] && continue
            echo "- \`$lbl\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$all_labels"
          fi

          echo "$all_labels" > all_labels.txt

      - name: Get released version tags
        run: |
          git ls-remote --tags --refs origin | cut -f2 | sed 's#^refs/tags/##' > released_tags.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Label Validation
        id: validate
        env:
          RELEASED_TAGS_FILE: released_tags.txt
        run: node scripts/internal-ci/validate-version-labels/index.js all_labels.txt

      - name: Validation Job Summary
        if: ${{ always() }}
        env:
          LABELS_UNAVAILABLE: ${{ steps.get_labels.outputs.labels_unavailable == 'true' }}
          NO_LABELS: ${{ steps.get_labels.outputs.no_labels == 'true' }}
          IS_VALID: ${{ steps.validate.outputs.isValid }}
          VALIDATION_MESSAGE: ${{ steps.validate.outputs.validationMessage }}
          INVALID_VERSION_LABELS: ${{ steps.validate.outputs.invalidVersionLabels }}
          HAS_UNTRACKED_VERSION: ${{ steps.validate.outputs.hasUntrackedVersion }}
          COMPONENT_VERSION_LABELS: ${{ steps.validate.outputs.componentVersionLabels }}
          DUPLICATE_COMPONENTS: ${{ steps.validate.outputs.duplicateComponents }}
          INVALID_COMPONENTS: ${{ steps.validate.outputs.invalidComponents }}
          MISSING_CHANGELOGS: ${{ steps.validate.outputs.missingChangelogs }}
          RELEASED_VERSIONS: ${{ steps.validate.outputs.releasedVersions }}
        run: |
          {
            echo "## Validation Outcome"

            if [ "$LABELS_UNAVAILABLE" == "true" ]; then
              echo "❌ Could not read the PR's labels from the GitHub API. Re-run the job."
            fi

            if [ "$NO_LABELS" == "true" ]; then
              echo "❌ No labels found on the PR. Add at least one version label."
            fi

            if [ "$IS_VALID" == "false" ]; then
              echo "❌ Version label validation failed."
              if [ -n "$VALIDATION_MESSAGE" ]; then
                echo "$VALIDATION_MESSAGE"
                echo ""
              fi
              if [ -n "$INVALID_VERSION_LABELS" ]; then
                echo "**Invalid version labels**: $INVALID_VERSION_LABELS"
              fi
              if [ -n "$DUPLICATE_COMPONENTS" ]; then
                echo "**Components with more than one version label**: $DUPLICATE_COMPONENTS"
              fi
              if [ -n "$INVALID_COMPONENTS" ]; then
                echo "**Nonexistent/Invalid components**: $INVALID_COMPONENTS"
              fi
              if [ -n "$MISSING_CHANGELOGS" ]; then
                echo "**Components missing changelogs/entries**: $MISSING_CHANGELOGS"
              fi
              if [ -n "$RELEASED_VERSIONS" ]; then
                echo "**Versions already released**: $RELEASED_VERSIONS"
              fi
            elif [ "$IS_VALID" == "true" ]; then
              echo "✅ Version label validation passed"
            fi
            echo -e "\n**Untracked Version**: $HAS_UNTRACKED_VERSION"
            if [ -n "$COMPONENT_VERSION_LABELS" ]; then
              echo "**Component Versions**: $COMPONENT_VERSION_LABELS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write Tags Job Summary
        id: tags_summary
        env:
          HAS_UNTRACKED_VERSION: ${{ steps.validate.outputs.hasUntrackedVersion }}
          VALID_COMPONENTS: ${{ steps.validate.outputs.validComponents }}
        run: |
          summary="## Tags\n"
          if [ "${HAS_UNTRACKED_VERSION}" = "true" ]; then
            summary+="- No Tags will be created on main"
          else
            summary+="The following tags will be created on main after merge\n\n"
            IFS=',' read -ra components <<< "$VALID_COMPONENTS"
            for component_version in "${components[@]}"; do
              summary+="🏷️  \`$component_version\`\n"
            done
            # Remove trailing newline
            summary="${summary%\\n}"
          fi

          echo -e "$summary" >> "$GITHUB_STEP_SUMMARY"

          # Replace any literal \n with real newlines for correct PR comment formatting
          summary_with_eol="${summary//\\n/$'\n'}"
          {
            echo "summary<<EOF"
            echo "$summary_with_eol"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write Tags to PR Comment
        uses: ./.github/actions/upsert-pr-comment
        with:
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-marker: version-summary
          body-content: ${{ steps.tags_summary.outputs.summary }}
